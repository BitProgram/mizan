[project]
name = "mizan-zarb"
version = "0.0.1"
description = "The scale for your money — money OS for solo software developers"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmed Hassan Khan", email = "bitprogram0@gmail.com" }]
requires-python = ">=3.11"
keywords = ["cli", "finance", "saas", "mrr", "indie", "developer", "money"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Environment :: Console",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
mizan = "mizan.cli.main:main"

[project.urls]
Homepage = "https://github.com/bitprogram/mizan"
Repository = "https://github.com/bitprogram/mizan"
Issues = "https://github.com/bitprogram/mizan/issues"
Changelog = "https://github.com/bitprogram/mizan/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mizan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
